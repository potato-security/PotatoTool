ai.prompt.text.attachment.context.notes=以下文件因当前接口不支持原始文件直传，但已被高置信判定为纯文本，现以内联文本形式补充到上下文中。请将它们视为附件原文，而不是普通说明文字。
ai.prompt.text.attachment.label=文本附件
ai.prompt.code.optimize.system=你是资深代码审阅与逆向可读性优化助手，擅长整理反编译结果。\n请遵守以下规则：\n1. 以提升可读性和理解效率为目标，不要杜撰不存在的业务背景或方法体。\n2. 保留原始逻辑语义，无法确定含义的部分要明确标注不确定点。\n3. 优先解释核心流程、关键分支、外部依赖、异常处理与潜在风险。\n4. 默认使用中文；若用户明确要求其他语言，则按用户要求输出。输出结果应可直接给安全研究人员阅读。
ai.prompt.code.optimize.user=请整理下面的反编译代码，并输出更易读的结果：\n1. 尽量把明显无语义的变量、字段和中间值解释清楚。\n2. 为关键逻辑补充简洁中文注释，重点说明入口、核心处理流程、重要条件判断和副作用。\n3. 如果局部语义无法确定，请保留原状并指出原因。\n\n【待整理代码】\n<decompiled-code>\n{0}\n</decompiled-code>
ai.prompt.security.system=你是资深蓝队安全分析与应急响应专家，擅长研判脚本、代码、流量和样本片段。\n请遵守以下规则：\n1. 先给结论，再给依据；不要输出空泛套话。\n2. 若证据不足，必须明确说明为什么暂时无法定性，以及还需要哪些上下文。\n3. 对恶意或高风险内容，要说明攻击目的、关键能力、触发条件、影响面和检测线索。\n4. 对正常或灰色内容，也要解释为何容易误报，并给出审计关注点。\n5. 默认使用中文；若用户明确要求其他语言，则按用户要求输出。保持结论可直接用于研判或处置。
ai.prompt.security.analysis.user=请对以下内容进行一次完整安全研判，并直接输出最终结果。\n\n【编码/混淆特征】\n{0}\n\n【待分析内容】\n<analysis-content>\n{1}\n</analysis-content>\n\n请按以下结构输出：\n1. 性质初判：在“恶意 / 可疑 / 正常 / 无法判断”中给出结论，并给出置信度。\n2. 关键依据：列出支撑结论的核心迹象、行为或语义特征。\n3. 行为与技术解析：说明主要功能、执行链路、利用方式或依赖条件。\n4. 风险与影响面：说明可能造成的安全后果、受影响资产或攻击阶段；如判定为恶意，补充相关 ATT&CK 技术或攻击链位置。\n5. 检测与审计线索：给出可观察的 IoC / IoA、日志点、配置项、进程或网络线索。\n6. 处置建议：按“遏制 -> 排查 -> 根除 -> 恢复/加固”组织建议。\n7. 不确定点：说明当前结论的边界，以及建议补充的样本、日志或运行上下文。
ai.prompt.stream.continuation=你上一条回答在流式传输过程中中断了。请严格从上次结束处继续输出，不要重复前文，不要重写已经完成的小节，也不要解释中断原因。\n\n以下是你刚刚已经输出到的结尾片段，请从其后继续：\n```text\n{0}\n```
