ai.prompt.conversation.attachment.notes=本次请求可能同时包含可直接传输的原始文件，以及因当前接口不支持直传而以内联纯文本方式补充的文件内容。如果附件暂不可读取、当前模型不支持该格式，或证据不足，请明确说明原因与边界。
